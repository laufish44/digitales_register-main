name: charts_flutter
version: 0.11.0
description: Material Design charting library for flutter.
author: Charts Team <charts_flutter@google.com>
homepage: https://github.com/google/charts

# Vendored copy of https://github.com/miDeb/charts (ref select_nearest),
# charts_flutter/. The upstream fork still calls hashValues()/hashList(), which
# Flutter removed in 3.x, so the app could not be compiled against a current
# Flutter SDK at all. The only changes here are those calls (now Object.hash /
# Object.hashAll), the matching imports, and the constraints below.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  # Pointing this to a local path allows for pointing to the latest code
  # in Github for open source development.
  #
  # The pub version of charts_flutter will point to the pub version of charts_common.
  # The latest pub version is commented out and shown below as an example.
  # charts_common: 0.9.0
  charts_common:
    git:
      url: https://github.com/miDeb/charts.git
      ref: select_nearest
      path: charts_common/
  collection: ^1.14.5
  flutter:
    sdk: flutter
  intl: '>=0.19.0 <0.21.0'
  logging: any
  meta: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
