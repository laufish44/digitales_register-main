name: dr
description: A new Flutter project.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# Read more about versioning at semver.org.
version: 8.3.0+51

publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  # Android's AlarmManager ("die Uhr" of the system): wakes a headless isolate
  # every 15 minutes to look for new register entries. Replaces the push
  # backend - nothing about this app talks to a server of ours any more.
  android_alarm_manager_plus: ^4.0.4
  badges: ^3.1.2
  biometric_storage: ^5.0.0
  built_collection: ^5.1.0
  built_redux:
    git:
      url: https://github.com/miDeb/built_redux.git
      ref: nnbd
  built_value: ^8.0.2
  # Vendored (see packages/charts_flutter/pubspec.yaml): the upstream fork does
  # not compile against Flutter 3.x any more.
  charts_flutter:
    path: packages/charts_flutter/
  collapsible_sidebar:
    path: packages/collapsible_sidebar/
  collection: ^1.15.0
  crypto: ^3.0.3
  cookie_jar: ^4.0.8
  deleteable_tile: ^0.0.1-nullsafety.1
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  dynamic_theme:
    path: packages/dynamic_theme/
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  flutter_built_redux:
    git:
      url: https://github.com/miDeb/flutter_built_redux.git
      ref: nnbd
  flutter_colorpicker: ^1.0.3
  flutter_local_notifications: ^19.0.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^8.0.0
  flutter_svg: ^2.0.10
  flutter_widget_from_html_core: ^0.15.2
  fuzzy: ^0.4.0-nullsafety.0
  hive: ^2.0.0
  http: ^1.3.0
  intl: 0.20.2
  mocktail: ^1.0.4
  mutex: ^3.0.0
  # Replaces the unmaintained miDeb/open_file fork, whose Android plugin still
  # used Flutter's removed v1 embedding (PluginRegistry.Registrar) and no longer
  # compiles. open_filex is the maintained successor with the same API.
  open_filex: ^4.5.0
  package_info_plus: ^8.1.0
  path_provider: ^2.0.0-nullsafety
  quill_delta: ^3.0.0-nullsafety.2
  quill_delta_viewer:
    path: packages/quill_delta_viewer/
  responsive_scaffold:
    path: packages/responsive_scaffold/
  scroll_to_index: ^3.0.1
  scrollable_positioned_list: ^0.3.8
  share_plus: ^10.1.4
  shared_preferences: ^2.0.15
  tuple: ^2.0.0
  # Replaces the unmaintained miDeb/uni_links fork, which still used Flutter's
  # removed v1 embedding (PluginRegistry.Registrar) and no longer compiles.
  app_links: ^6.3.2
  url_launcher: ^6.1.0

dependency_overrides:
  file: ^6.1.4
  # flutter_localizations (Flutter SDK) pins intl 0.20.2, but the charts_flutter
  # fork still declares ^0.19.0. The APIs we use are unchanged between the two.
  # Pinned exactly: intl 0.20.3 declares language version 3.9, which the Dart
  # 3.8 SDK in Flutter 3.32 refuses to compile.
  intl: 0.20.2

dev_dependencies:
  build_runner: ^2.1.10
  built_value_generator: ^8.0.2
  flutter_native_splash: ^2.1.6
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  lint: ^2.1.2
  matcher: ^0.12.10-nullsafety.3
  msix: ^3.16.7
  quiver: ^3.0.0-nullsafety.3

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/index.png"

flutter_native_splash:
  color: "fafafa"
  color_dark: "303030"
  image: "assets/4.0x/splash-light.png"
  image_dark: "assets/4.0x/splash-dark.png"

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
  #  - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.io/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.io/custom-fonts/#from-packages

msix_config:
  display_name: Digitales Register
  publisher_display_name: Michael Debertol
  identity_name: 2097MichaelDebertol.DigitalesRegister
  publisher: CN=2508760A-808B-4829-867A-4DB53593750E
  msix_version: 8.3.0.0
  logo_path: assets/4.0x/transparent.png
  architecture: x64
  capabilities: "internetClient"
